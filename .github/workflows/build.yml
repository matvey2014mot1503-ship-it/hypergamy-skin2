name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          echo "::error title=build-log::$(grep -E 'error:|What went wrong|Caused by|Could not|not found' -A2 build.log | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')"

      - uses: actions/upload-artifact@v4
        with:
          name: hypergamy-skin
          path: build/libs/*.jar

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
